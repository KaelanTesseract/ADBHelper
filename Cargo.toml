[package]
name = "adbhelper"
version = "0.5.6"
edition = "2021"
description = "ADBHelper for AFK Journey automation"
license = "MIT"

[workspace]

[[bin]]
name = "adbhelper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", features = ["default_fonts", "glow", "wayland", "x11"], default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# Glyph outlines for the Hero Box picture; already used by egui (MIT OR Apache-2.0).
skrifa = "0.44"
# The font egui already ships (Ubuntu Font Licence), drawn on that picture.
epaint_default_fonts = "0.37"
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
# Texts in .ftl files; fluent-bundle and unic-langid are MIT OR Apache-2.0 (same versions as PlanoraCAD).
fluent-bundle = "=0.16.0"
unic-langid = "=0.9.6"
# Verifies update signatures (minisign, Ed25519); MIT.
minisign-verify = "=0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_WinRT"] }

[dev-dependencies]
# Parses the .ftl files in tests to compare ids and placeholders; MIT OR Apache-2.0.
fluent-syntax = "=0.12.0"
# Signs releases in examples/release-signing.rs and creates test keys; MIT.
minisign = "=0.7.9"

[build-dependencies]
embed-resource = "3.0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
