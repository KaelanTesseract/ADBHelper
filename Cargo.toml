[package]
name = "adbhelper"
version = "0.2.1"
edition = "2021"
description = "ADBHelper for AFK Journey automation"
license = "MIT"

[workspace]

[[bin]]
name = "adbhelper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", features = ["default_fonts", "glow", "wayland", "x11"], default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.12"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
