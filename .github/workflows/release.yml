name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Test and build with mandatory patchnotes
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version $env:GITHUB_REF_NAME
      - name: Publish release and patchnotes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('dist/ADBHelper-Windows-x64.exe', 'dist/ADBHelper-Windows-x64.exe.sha256')
          $image = "releases/media/ADBHelper-$env:GITHUB_REF_NAME.png"
          if (Test-Path -LiteralPath $image) { $assets += $image }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "ADBHelper $env:GITHUB_REF_NAME" --notes-file "releases/$env:GITHUB_REF_NAME.md"
