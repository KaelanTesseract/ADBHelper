name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build with mandatory patchnotes
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version $env:GITHUB_REF_NAME
      - name: Publish release and patchnotes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/ADBHelper-Windows-x64.exe dist/ADBHelper-Windows-x64.exe.sha256 --verify-tag --title "ADBHelper $env:GITHUB_REF_NAME" --notes-file "releases/$env:GITHUB_REF_NAME.md"
